name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Release gates (spec section 22) already enforced here: lint, typecheck, unit tests,
# brand-string check, secret scan, high/critical vulnerability audit.
# Gates that arrive with their milestones (tracked in docs/TODO.md, not silently skipped):
#   M1  scenario suite + 100% engine branch coverage
#   M2  done: banned-words check on English UI copy, axe a11y (jsdom), unreviewed-protocol prod gate
#       still to come: Playwright e2e, Lighthouse CI budgets, secret scan of the web output (docs/TODO.md)
#   M3+ Trivy container scan
#   M9  CodeQL, OWASP ZAP baseline, SBOM (CycloneDX), k6 load test
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm check:brand
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # Release gate (spec 5.5): a production build must refuse an unreviewed protocol.
      - name: Production build must fail while the protocol is a draft
        run: |
          if pnpm build:release; then
            echo "::error::build:release accepted a DRAFT protocol"
            exit 1
          fi
      # Last, so apps/web/out is the tester build (banner, noindex, display floor).
      - run: pnpm build:tester

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Container run avoids the gitleaks-action licence requirement for organisations.
      # TODO(docs/TODO.md): pin the image to a specific version.
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            git /repo --redact --no-banner --exit-code 1

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
